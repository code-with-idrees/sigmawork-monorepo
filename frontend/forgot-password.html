<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your SigmaWork account password." />
  <title>Forgot Password — SigmaWork</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Brand -->
  <div class="brand">
    <div class="brand-icon"></div>
    <span class="brand-name">Sigma Evolution</span>
  </div>

  <!-- Card -->
  <div class="auth-card" id="forgot-card">

    <!-- Tab toggle (both inactive, just for consistency) -->
    <div class="tab-toggle">
      <a href="signup.html" id="tab-signup">Sign up</a>
      <a href="index.html" id="tab-login">Log in</a>
    </div>

    <h1>Reset your password</h1>
    <p style="text-align:center; color:var(--text-muted); font-size:0.88rem; margin-bottom:24px; line-height:1.5;">
      Enter your email address and we'll send you instructions to reset your password.
    </p>

    <!-- Message banner -->
    <div id="form-message" class="message" role="alert"></div>

    <!-- Forgot password form -->
    <form id="forgot-form" novalidate>

      <div class="field">
        <label for="forgot-email">Email address</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="forgot-email"
            name="email"
            placeholder="hello@reallygreatsite.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="field-error" id="forgot-email-error"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="forgot-btn">
        <span>Send reset link</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="auth-footer" style="margin-top:28px;">
      Remember your password? <a href="index.html">Log in</a>
    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
